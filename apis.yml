aid: digifinex

name: DigiFinex

description: 'DigiFinex is a centralized cryptocurrency exchange offering spot, margin and perpetual swap (USDT-margined)
  trading, OTC, copy trading and a crypto card. It publishes a public developer API: a signed REST API for spot and
  margin (openapi.digifinex.com/v3), a REST API for perpetual swaps (openapi.digifinex.com/swap/v2), and WebSocket
  market and account streams, documented at docs.digifinex.com. Private endpoints are signed with ACCESS-KEY,
  ACCESS-SIGN (HMAC-SHA256) and ACCESS-TIMESTAMP headers.'

