              type: object
              required:
              - symbol
              - type
              - amount
              properties:
                symbol:
                  type: string
                  description: Symbol Name
                type:
                  type: string
                  description: buy for limit buy order, sell for limit sell order, buy_market for market buy order, sell_market for market sell order
                amount:
                  type: number
                  description: Order amount, value in quote currency for market orders and base currency in other order types
                price:
                  type: number
                  description: Order price required for limit order
                post_only:
                  type: integer
                  description: Default 0, enabled by 1, if enabled the order will be cancelled if it can be executed immediately, making sure there will be no market taking
