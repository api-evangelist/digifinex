        accessSign: []
        accessTimestamp: []
      responses:
        '200':
          description: 'Success; the body carries "code": 0 as documented.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Status code (0 = success)
components:
  securitySchemes:
    accessKey:
      type: apiKey
      in: header
      name: ACCESS-KEY
      description: User's API-KEY
    accessSign:
      type: apiKey
      in: header
      name: ACCESS-SIGN
      description: HMAC-SHA256 signature of the request parameters, keyed by the API secret, as documented
    accessTimestamp:
      type: apiKey
      in: header
      name: ACCESS-TIMESTAMP
      description: Timestamp in seconds (spot); requests more than 5 seconds old are rejected unless ACCESS-RECV-WINDOW is
        set
